<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ttds-talk-primary" x1="6.5" y1="10" x2="25.5" y2="27.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C7FE" />
      <stop offset="1" stop-color="#355BE0" />
    </linearGradient>
    <linearGradient id="ttds-talk-echo" x1="16" y1="5.5" x2="31" y2="18.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CE2EC" />
      <stop offset="1" stop-color="#3DB6D6" />
    </linearGradient>
    <mask id="ttds-talk-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#FFFFFF" />
      <path
        d="M10.7 9.5H20.3A6.2 6.2 0 0 1 26.5 15.7V20.3A6.2 6.2 0 0 1 20.3 26.5H12.0L7.3 29.9C6.4 30.55 5.3 29.75 5.65 28.7L6.55 24.9A6.2 6.2 0 0 1 4.5 20.3V15.7A6.2 6.2 0 0 1 10.7 9.5Z"
        fill="#000000"
        stroke="#000000"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <!-- Back reply speech bubble (full-duplex Talk partner) with theme-safe transparent cutout -->
  <g mask="url(#ttds-talk-cutout)">
    <path
      d="M20.7 5.2H26.3A5.2 5.2 0 0 1 31.5 10.4V12.4A5.2 5.2 0 0 1 29.8 16.25L30.55 18.85C30.8 19.7 29.9 20.35 29.15 19.8L26.0 17.6H20.7A5.2 5.2 0 0 1 15.5 12.4V10.4A5.2 5.2 0 0 1 20.7 5.2Z"
      fill="url(#ttds-talk-echo)"
    />
  </g>

  <!-- Front primary Talk bubble -->
  <path
    d="M10.7 9.5H20.3A6.2 6.2 0 0 1 26.5 15.7V20.3A6.2 6.2 0 0 1 20.3 26.5H12.0L7.3 29.9C6.4 30.55 5.3 29.75 5.65 28.7L6.55 24.9A6.2 6.2 0 0 1 4.5 20.3V15.7A6.2 6.2 0 0 1 10.7 9.5Z"
    fill="url(#ttds-talk-primary)"
  />

  <!-- Crisp rhythmic voice bars centered inside primary Talk bubble -->
  <path
    d="M11 16.3V19.7M14 13.4V22.6M17 14.8V21.2M20 16.5V19.5"
    stroke="#FFFFFF"
    stroke-width="2.15"
    stroke-linecap="round"
  />
</svg>
