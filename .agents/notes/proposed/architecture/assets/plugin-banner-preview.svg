<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none">
  <defs>
    <radialGradient id="banner-mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4D6BFE" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#4D6BFE" stop-opacity="0" />
    </radialGradient>
    <clipPath id="banner-dsh-window-clip">
      <rect x="312" y="108" width="296" height="162" rx="12" />
    </clipPath>
  </defs>

  <!-- Official DSH Plugin Preview Canvas (640x300, #F5F6FC) -->
  <rect width="640" height="300" fill="#F5F6FC" />

  <!-- Top Eyebrow & Headlines (matching cua-bundle & voice-input-bundle layout) -->
  <rect x="32" y="25" width="3" height="10" rx="1.5" fill="#4D6BFE" />
  <text x="42" y="34" fill="#4D6BFE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.08em">TALK TO DEEPSEEK</text>

  <text x="32" y="63" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21.5" font-weight="600">实时语音对话，边聊边干统筹工作台</text>
  <text x="32" y="86" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">全双工自然口语交谈 · 后台异步调用 DSH 工具 · 话轮静默礼让播报</text>

  <!-- ===================================================================== -->
  <!-- Left Card: Full-Duplex Natural Voice Talk -->
  <!-- ===================================================================== -->
  <rect x="32" y="110" width="242" height="160" rx="12" fill="#FFFFFF" stroke="#DCE2EF" />
  <text x="48" y="132" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500">全双工口语交谈</text>
  <rect x="200" y="120" width="58" height="18" rx="9" fill="#EDF2FF" />
  <circle cx="210" cy="129" r="2.5" fill="#4D6BFE" />
  <text x="217" y="132.5" fill="#4D6BFE" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="500">倾听/说话</text>

  <!-- Miniature TTDS Hollow Radial Acoustic Core + Steady FishLogo -->
  <g transform="translate(80, 198)">
    <circle cx="0" cy="0" r="36" fill="url(#banner-mist)" />
    <circle cx="0" cy="0" r="20" stroke="#DCE2EF" stroke-width="0.9" />
    <!-- Smooth Sine Radial Acoustic Needles (24 needles) -->
    <g stroke="#4D6BFE" stroke-width="1.65" stroke-linecap="round" opacity="0.88">
      <line x1="0" y1="-23" x2="0" y2="-35" />
      <line x1="6.1" y1="-22.2" x2="9.6" y2="-35.2" />
      <line x1="11.5" y1="-19.9" x2="18.5" y2="-32.0" />
      <line x1="16.2" y1="-16.2" x2="23.5" y2="-23.5" />
      <line x1="19.9" y1="-11.5" x2="26.4" y2="-15.2" />
      <line x1="22.2" y1="-6.1" x2="31.2" y2="-8.4" />
      <line x1="23" y1="0" x2="36" y2="0" />
      <line x1="22.2" y1="6.1" x2="33.8" y2="9.1" />
      <line x1="19.9" y1="11.5" x2="27.8" y2="16.0" />
      <line x1="16.2" y1="16.2" x2="21.8" y2="21.8" />
      <line x1="11.5" y1="19.9" x2="16.8" y2="29.0" />
      <line x1="6.1" y1="22.2" x2="9.4" y2="34.2" />
      <line x1="0" y1="23" x2="0" y2="35" />
      <line x1="-6.1" y1="22.2" x2="-8.6" y2="31.5" />
      <line x1="-11.5" y1="19.9" x2="-15.5" y2="26.8" />
      <line x1="-16.2" y1="16.2" x2="-22.6" y2="22.6" />
      <line x1="-19.9" y1="11.5" x2="-29.5" y2="17.0" />
      <line x1="-22.2" y1="6.1" x2="-34.2" y2="9.4" />
      <line x1="-23" y1="0" x2="-35" y2="0" />
      <line x1="-22.2" y1="-6.1" x2="-30.8" y2="-8.3" />
      <line x1="-19.9" y1="-11.5" x2="-25.6" y2="-14.8" />
      <line x1="-16.2" y1="-16.2" x2="-21.6" y2="-21.6" />
      <line x1="-11.5" y1="-19.9" x2="-17.5" y2="-30.3" />
      <line x1="-6.1" y1="-22.2" x2="-9.2" y2="-33.6" />
    </g>
    <!-- Steady DeepSeek Whale Core -->
    <g transform="translate(-10.5, -7.8) scale(0.88)">
      <path d="M22.9 1.43c-.24-.12-.35.11-.5.23-.39.42-.83.7-1.43.67-.8-.05-1.48.2-2.09.82-.13-.76-.55-1.2-1.2-1.5-.34-.15-.68-.3-.92-.63-.21-.3-.24-.63-.35-.98-.06-.18-.27-.08-.39.23-.3.55-.42 1.16-.41 1.78.03 1.38.61 2.49 1.77 3.27.13.09.17.18.13.31-.08.27-.18.53-.26.8-.05.17-.13.21-.32.14-.64-.27-1.19-.66-1.68-1.14-.82-.8-1.57-1.68-2.5-2.37-.22-.16-.44-.31-.67-.46-.95-.92.13-1.68.38-1.77.26-.09.09-.42-.75-.41-.84 0-1.61.28-2.59.66-.15.06-.3.1-.45.13-.89-.17-1.82-.21-2.78-.1-1.82.2-3.27 1.06-4.34 2.53C.08 5.41-.22 7.42.15 9.51c.39 2.2 1.51 4.03 3.24 5.45 1.79 1.48 3.86 2.21 6.21 2.07 1.43-.08 3.02-.28 4.82-1.8.45.23.93.32 1.72.39.61.05 1.19-.03 1.64-.13.71-.15.66-.81.4-.93-1.6-.77-1.92-.82-2.03-.89 1.05-1.25 2.67-3.47 3.17-6.5.05-.33.11-.8.1-1.07 0-.17.04-.23.22-.25.52-.06 1.03-.2 1.49-.46 1.35-.74 1.89-1.95 2.02-3.4.02-.22 0-.45-.24-.56z" fill="#4D6BFE" />
    </g>
  </g>

  <!-- Conversational Talk Bubbles on Right Half of Left Card -->
  <rect x="128" y="150" width="132" height="36" rx="9" fill="#EDF2FF" />
  <text x="137" y="166" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="500">“看看仓库有哪些改动，</text>
  <text x="137" y="180" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="500">再帮我搜一下新文档”</text>

  <rect x="128" y="196" width="132" height="48" rx="9" fill="#F7F9FD" stroke="#E2E7F3" />
  <text x="137" y="213" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">“好，后台帮你查着，</text>
  <text x="137" y="227" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">共改了 3 处，咱们继续聊”</text>
  <path d="M138 236V239M141.5 234.5V240.5M145 235.5V239.5" stroke="#4D6BFE" stroke-width="1.3" stroke-linecap="round" />
  <text x="151" y="239.5" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9">流式边聊边干</text>

  <!-- ===================================================================== -->
  <!-- Connector Arrow (Official #95A5D4 1.7px rounded arrow) -->
  <!-- ===================================================================== -->
  <path d="M283 190H303M298 185L303 190L298 195" fill="none" stroke="#95A5D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ===================================================================== -->
  <!-- Right Card: Miniature DSH Workspace Window & Async Bridge Synergy -->
  <!-- ===================================================================== -->
  <g clip-path="url(#banner-dsh-window-clip)">
    <rect x="312" y="108" width="296" height="162" rx="12" fill="#FFFFFF" />

    <!-- Window Titlebar -->
    <rect x="312" y="108" width="296" height="26" fill="#F9FAFD" />
    <line x1="312" y1="134" x2="608" y2="134" stroke="#E4E8F1" />
    <circle cx="326" cy="121" r="3" fill="#E4ABAE" />
    <circle cx="336" cy="121" r="3" fill="#E4CEA1" />
    <circle cx="346" cy="121" r="3" fill="#A9C9B4" />
    <text x="460" y="124.5" text-anchor="middle" fill="#77829A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500">DeepSeek Harness</text>

    <!-- Mini Left Sidebar -->
    <rect x="312" y="134" width="42" height="136" fill="#F7F8FC" />
    <line x1="354" y1="134" x2="354" y2="270" stroke="#E9ECF4" />
    <rect x="320" y="144" width="26" height="20" rx="5" fill="#E9EDFD" />
    <path d="M327 151H339M327 155H336" stroke="#6E84D8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M327 176H339M327 180H335M327 198H339M327 202H335" stroke="#C2CADA" stroke-width="1.2" stroke-linecap="round" />

    <!-- Workspace Async Tool & Hook Synergy Rows -->
    <g transform="translate(366, 145)">
      <!-- Row 1: Inspect Workspace Changes -->
      <rect x="0" y="0" width="222" height="32" rx="8" fill="#F6F8FC" stroke="#E6EAF4" />
      <circle cx="12" cy="16" r="3.5" fill="#4D6BFE" />
      <text x="22" y="14.5" fill="#253047" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">dsh_inspect_workspace_changes</text>
      <text x="22" y="26" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">异步读取工作区改动 · 不打断语音</text>
      <rect x="172" y="7" width="42" height="18" rx="5" fill="#EDF2FF" />
      <text x="193" y="19" text-anchor="middle" fill="#4D6BFE" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500">自动执行</text>

      <!-- Row 2: DSH Search -->
      <rect x="0" y="40" width="222" height="32" rx="8" fill="#F6F8FC" stroke="#E6EAF4" />
      <circle cx="12" cy="56" r="3.5" fill="#3DB6D6" />
      <text x="22" y="54.5" fill="#253047" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">dsh_search</text>
      <text x="86" y="54.5" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">宿主公开联网检索</text>
      <text x="22" y="66" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">结果后台回填，待当前话轮收尾续答</text>
      <rect x="172" y="47" width="42" height="18" rx="5" fill="#E9F8FB" />
      <text x="193" y="59" text-anchor="middle" fill="#2993B2" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="500">已回填</text>

      <!-- Row 3: Quiet Grace & Event Hook Batching -->
      <rect x="0" y="80" width="222" height="34" rx="8" fill="#FAFBFD" stroke="#E6EAF4" stroke-dasharray="3 2" />
      <text x="12" y="95" fill="#253047" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="500">话轮静默礼让（5000ms）与跨会话伴随</text>
      <text x="12" y="108" fill="#768197" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5">讲话时不抢话，静默后合并播报会话完成与审批提醒</text>
    </g>

    <!-- Edge-Tucked Half-Peek Floating Orb on Right Window Edge -->
    <g transform="translate(608, 202)">
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#DCE2EF" stroke-width="1" />
      <circle cx="0" cy="0" r="10.5" stroke="#4D6BFE" stroke-width="1.3" stroke-dasharray="2 2.2" />
      <circle cx="-4" cy="0" r="2.2" fill="#4D6BFE" />
    </g>
  </g>
  <rect x="312" y="108" width="296" height="162" rx="12" stroke="#DCE2EF" />
</svg>
